name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and verify (tests + coverage gate)
        run: ./mvnw -B -ntp verify

  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spotless format check
        run: ./mvnw -B -ntp spotless:check

  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: core must stay Spring-free
        run: |
          if grep -rq "org.springframework" ragfoundry-core/src/main/java; then
            echo "::error::ragfoundry-core 不得依赖 org.springframework（核心库必须零 Spring 依赖，由 CI 机器化守住）"
            grep -rn "org.springframework" ragfoundry-core/src/main/java
            exit 1
          fi
          echo "OK: ragfoundry-core 无 Spring 依赖"
